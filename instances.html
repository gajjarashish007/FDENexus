<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EC2 Instances · FDE Nexus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
<div class="nx-app" id="nx-app" data-page="instances.html" data-title="EC2 Instances">
  <div class="nx-page-head">
    <div><h1>EC2 Instances</h1>
      <p>Instances in the active AWS account: start, stop, reboot, terminate. New instances are launched as reviewed Terraform changes.</p></div>
    <div class="nx-head-actions"><span id="ec2-mode"></span> <a class="btn btn-primary ms-2" href="launch.html?type=ec2-instance"><i class="bi bi-rocket-takeoff me-1"></i>Launch instance</a></div>
  </div>


  <div id="ec2-pane-list">
    <div class="nx-toolbar">
      <div class="nx-grow"><input id="ec2-search" type="search" class="form-control" placeholder="Search by name, id, IP…"></div>
      <select id="ec2-state" class="form-select" style="max-width:170px">
        <option value="">All states</option><option>running</option><option>stopped</option><option>pending</option><option>terminated</option></select>
      <button class="btn btn-outline-secondary" id="ec2-refresh"><i class="bi bi-arrow-clockwise me-1"></i>Refresh</button>
    </div>
    <div class="nx-card"><div class="nx-table-wrap">
      <table class="nx-table"><thead><tr><th>Name</th><th>Instance ID</th><th>State</th><th>Type</th><th>OS</th><th>Public IP</th><th>Env</th><th>Launched</th><th class="text-end">Actions</th></tr></thead>
        <tbody id="ec2-body"></tbody></table></div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/m01-api.js"></script>
<script src="js/components.js"></script>
<script src="js/app.js"></script>
<script src="js/instances.js"></script>
</body>
</html>
