<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Activity & Audit Log · FDE Nexus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css?v=202611231725" rel="stylesheet">
</head>
<body>
<div class="nx-app" id="nx-app" data-page="activity.html" data-title="Activity & Audit Log">

  <div class="nx-page-head">
    <div><h1>Activity &amp; Audit Log</h1>
      <p>An append-only, tamper-evident record of actions. Read-only. Export is simulated.</p></div>
    <div class="nx-head-actions"><button class="btn btn-outline-secondary" id="nx-act-export"><i class="bi bi-download me-1"></i>Export</button></div>
  </div>
  <div class="nx-toolbar">
    <div class="nx-grow"><input id="nx-act-search" type="search" class="form-control" placeholder="Search actor, action, target…"></div>
    <select id="nx-act-tone" class="form-select" style="max-width:180px">
      <option value="">All outcomes</option><option value="success">Success</option>
      <option value="warning">Warning</option><option value="danger">Blocked / failed</option><option value="info">Info</option></select>
    <span class="nx-pageinfo ms-auto" id="nx-act-info"></span>
  </div>
  <div class="nx-card"><div class="nx-table-wrap">
    <table class="nx-table">
      <thead><tr><th>Time (UTC)</th><th>Actor</th><th>Action</th><th>Target</th><th>Decision</th><th>Module</th></tr></thead>
      <tbody id="nx-act-body"></tbody>
    </table>
  </div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/mock-data.js?v=202611231725"></script>
<script src="js/m01-api.js?v=202611231725"></script>
<script src="js/components.js?v=202611231725"></script>
<script src="js/app.js?v=202611231725"></script>
</body>
</html>
