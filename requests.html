<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Requests & Approvals · FDE Nexus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css?v=202611231725" rel="stylesheet">
</head>
<body>
<div class="nx-app" id="nx-app" data-page="requests.html" data-title="Requests & Approvals">

  <div class="nx-page-head">
    <div><h1>Requests &amp; Approvals</h1>
      <p>Governed self-service requests with risk tiers and an approval center.</p></div>
    <div class="nx-head-actions"><button class="btn btn-primary" id="nx-new-request"><i class="bi bi-plus-lg me-1"></i>New request</button></div>
  </div>
  <div class="nx-toolbar">
    <div class="nx-grow"><input id="nx-req-search" type="search" class="form-control" placeholder="Search by id, item, team…"></div>
    <select id="nx-req-risk" class="form-select" style="max-width:170px">
      <option value="">All risk tiers</option><option value="R0">R0 Read-only</option><option value="R1">R1 Low</option>
      <option value="R2">R2 Medium</option><option value="R3">R3 High</option></select>
    <select id="nx-req-status" class="form-select" style="max-width:170px">
      <option value="">All statuses</option><option value="pending">Pending</option>
      <option value="approved">Approved</option><option value="rejected">Rejected</option></select>
  </div>
  <div class="nx-card">
    <div class="nx-table-wrap">
      <table class="nx-table" id="nx-req-table">
        <thead><tr>
          <th class="sortable" data-key="id">ID <i class="bi bi-arrow-down-up"></i></th>
          <th class="sortable" data-key="item">Item <i class="bi bi-arrow-down-up"></i></th>
          <th class="sortable" data-key="team">Team <i class="bi bi-arrow-down-up"></i></th>
          <th class="sortable" data-key="risk">Risk <i class="bi bi-arrow-down-up"></i></th>
          <th>Cost</th>
          <th class="sortable" data-key="status">Status <i class="bi bi-arrow-down-up"></i></th>
          <th class="sortable" data-key="submitted">Submitted <i class="bi bi-arrow-down"></i></th>
          <th class="text-end">Actions</th>
        </tr></thead>
        <tbody id="nx-req-body"></tbody>
      </table>
    </div>
    <div class="nx-card-body">
      <div class="nx-pager">
        <span class="nx-pageinfo" id="nx-req-info"></span>
        <div class="btn-group" id="nx-req-pages"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/mock-data.js?v=202611231725"></script>
<script src="js/m01-api.js?v=202611231725"></script>
<script src="js/components.js?v=202611231725"></script>
<script src="js/app.js?v=202611231725"></script>
</body>
</html>
