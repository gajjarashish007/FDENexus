<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Environments · FDE Nexus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
<div class="nx-app" id="nx-app" data-page="environments.html" data-title="Environments">
  <div class="nx-page-head">
    <div><h1>Environments</h1>
      <p>An environment is where resources launch: a new VPC + baseline built by the portal, or an existing VPC already in your account. Every change is Terraform via Atmos and goes through review.</p></div>
    <div class="nx-head-actions">
      <button class="btn btn-outline-secondary d-none" id="ev-provision"><i class="bi bi-building-add me-1"></i>Provision AWS account</button>
      <a class="btn btn-outline-secondary" href="launch.html"><i class="bi bi-rocket-takeoff me-1"></i>Launch resource</a>
      <button class="btn btn-outline-primary" id="ev-import"><i class="bi bi-box-arrow-in-down me-1"></i>Use existing VPC</button>
      <button class="btn btn-primary" id="ev-new"><i class="bi bi-plus-lg me-1"></i>New environment</button>
    </div>
  </div>
  <div class="row g-3" id="ev-kpis"></div>
  <div id="ev-wizard" class="d-none mt-3">
    <div class="nx-steps" id="ev-steps"></div>
    <div class="nx-card"><div class="nx-card-body" id="ev-body"></div>
      <div class="nx-card-body d-flex justify-content-between border-top">
        <div><button class="btn btn-outline-secondary" id="ev-back"><i class="bi bi-arrow-left me-1"></i>Back</button>
          <button class="btn btn-link" id="ev-cancel">Cancel</button></div>
        <button class="btn btn-primary" id="ev-next">Next<i class="bi bi-arrow-right ms-1"></i></button>
      </div></div>
  </div>
  <div class="nx-card mt-3" id="ev-list-card"><div class="nx-table-wrap"><table class="nx-table">
    <thead><tr><th>Environment</th><th>Tier</th><th>Account / region</th><th>Network</th><th>Components</th><th>Est. monthly</th><th>Status</th><th class="text-end">Actions</th></tr></thead>
    <tbody id="ev-body-list"></tbody></table></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/m01-api.js"></script>
<script src="js/components.js"></script>
<script src="js/app.js"></script>
<script src="js/nx-ui.js"></script>
<script src="js/environments.js"></script>
</body>
</html>
