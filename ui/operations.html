<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Operations Registry · FDE Nexus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
<div class="nx-app" id="nx-app" data-page="operations.html" data-title="Operations Registry">

  <div class="nx-page-head">
    <div><h1>Operations Registry</h1>
      <p>Every automated operation is registered with a risk tier (R0–R3), approval policy and SLO. Running is simulated.</p></div>
  </div>
  <div class="nx-toolbar">
    <div class="nx-grow"><input id="nx-op-search" type="search" class="form-control" placeholder="Search operations…"></div>
    <select id="nx-op-risk" class="form-select" style="max-width:180px">
      <option value="">All risk tiers</option><option value="R0">R0 Read-only</option><option value="R1">R1 Low</option>
      <option value="R2">R2 Medium</option><option value="R3">R3 High</option></select>
    <span class="nx-pageinfo ms-auto" id="nx-op-info"></span>
  </div>
  <div class="nx-card"><div class="nx-table-wrap">
    <table class="nx-table">
      <thead><tr><th>ID</th><th>Operation</th><th>Module</th><th>Trigger</th><th>Risk</th><th>Approval</th><th class="text-end">Action</th></tr></thead>
      <tbody id="nx-op-body"></tbody>
    </table>
  </div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/components.js"></script>
<script src="js/app.js"></script>
</body>
</html>
