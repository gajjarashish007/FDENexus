<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Module Details · FDE Nexus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
<div class="nx-app" id="nx-app" data-page="service-details.html" data-title="Module Details">

  <nav aria-label="breadcrumb" class="mb-2"><ol class="breadcrumb small mb-0">
    <li class="breadcrumb-item"><a href="services.html">Modules</a></li>
    <li class="breadcrumb-item active" id="nx-detail-breadcrumb">Module</li></ol></nav>
  <div class="nx-card mb-3"><div class="nx-card-body" id="nx-detail-head"></div></div>
  <div id="nx-detail" class="nx-tab-host">
    <input type="hidden" id="nx-detail-title">
    <div class="nx-tabs" data-group="detail">
      <button class="active" data-tab="capabilities">Capabilities</button>
      <button data-tab="operations">Operations</button>
      <button data-tab="findings">Findings</button>
      <button data-tab="activity">Activity</button>
    </div>
    <div class="nx-tabpane active" id="pane-capabilities"></div>
    <div class="nx-tabpane" id="pane-operations"></div>
    <div class="nx-tabpane" id="pane-findings"></div>
    <div class="nx-tabpane" id="pane-activity"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/components.js"></script>
<script src="js/app.js"></script>
</body>
</html>
