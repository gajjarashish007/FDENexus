<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homographic Dashboard</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .header {
            text-align: center;
            margin-bottom: 3rem;
        }
        
        .title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        
        .subtitle {
            font-size: 1.125rem;
            opacity: 0.7;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .card {
            background: var(--card);
            border-radius: 0.75rem;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        
        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        
        .metric {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
        }
        
        .chart-container {
            height: 200px;
            background: linear-gradient(135deg, var(--primary) 0%, #3b82f6 100%);
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }
        
        .status-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
        }
        
        .status-item {
            text-align: center;
            padding: 1rem;
            background: var(--bg);
            border-radius: 0.5rem;
        }
        
        .status-value {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }
        
        .status-label {
            font-size: 0.875rem;
            opacity: 0.7;
        }
        
        @media (max-width: 768px) {
            .container { padding: 1rem; }
            .grid { grid-template-columns: 1fr; }
            .status-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">Homographic Dashboard</h1>
            <p class="subtitle">Unified visual representation of system metrics</p>
        </div>
        
        <div class="grid">
            <div class="card">
                <h3 class="card-title">System Overview</h3>
                <div class="metric">98.5%</div>
                <p>Uptime</p>
            </div>
            
            <div class="card">
                <h3 class="card-title">Performance</h3>
                <div class="chart-container">
                    Performance Chart
                </div>
            </div>
            
            <div class="card">
                <h3 class="card-title">Resources</h3>
                <div class="status-grid">
                    <div class="status-item">
                        <div class="status-value">24</div>
                        <div class="status-label">CPU</div>
                    </div>
                    <div class="status-item">
                        <div class="status-value">67%</div>
                        <div class="status-label">Memory</div>
                    </div>
                    <div class="status-item">
                        <div class="status-value">45GB</div>
                        <div class="status-label">Storage</div>
                    </div>
                    <div class="status-item">
                        <div class="status-value">12</div>
                        <div class="status-label">Pods</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
