<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Launch resources · FDE Nexus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
<div class="nx-app" id="nx-app" data-page="launch.html" data-title="Launch resources">
  <div class="nx-page-head">
    <div><h1>Launch resources</h1>
      <p>Pick what you need, choose options, review the generated Terraform/Atmos change, submit. Approved changes are committed to GitLab.</p></div>
    <div class="nx-head-actions"><a class="btn btn-outline-secondary" href="changes.html"><i class="bi bi-file-diff me-1"></i>My changes</a></div>
  </div>
  <div class="nx-steps" id="ln-steps"></div>
  <div class="nx-card"><div class="nx-card-body" id="ln-body"><div class="nx-empty"><i class="bi bi-hourglass-split"></i>Loading…</div></div>
    <div class="nx-card-body d-flex justify-content-between border-top">
      <button class="btn btn-outline-secondary" id="ln-back"><i class="bi bi-arrow-left me-1"></i>Back</button>
      <button class="btn btn-primary" id="ln-next">Next<i class="bi bi-arrow-right ms-1"></i></button>
    </div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/m01-api.js"></script>
<script src="js/components.js"></script>
<script src="js/app.js"></script>
<script src="js/nx-ui.js"></script>
<script src="js/launch.js"></script>

</html>
