<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kubernetes · FDE Nexus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css?v=202611231725" rel="stylesheet">
</head>
<body>
<div class="nx-app" id="nx-app" data-page="kubernetes.html" data-title="Kubernetes">
  <div class="nx-page-head">
    <div><h1>Kubernetes</h1>
      <p>Operate EKS and other clusters: health, pods, workloads, nodes, logs, diagnosis and safe actions. Cluster creation and sizing stay in Environments (Terraform).</p></div>
    <div class="nx-head-actions"><button class="btn btn-outline-secondary d-none" id="k-add"><i class="bi bi-plus-lg me-1"></i>Add cluster</button></div>
  </div>
  <div class="nx-card mb-3"><div class="nx-card-body d-flex flex-wrap gap-2 align-items-center">
    <i class="bi bi-boxes fs-4 text-primary"></i>
    <select class="form-select" id="k-cluster" style="max-width:360px" aria-label="Cluster"></select>
    <span id="k-meta" class="d-flex flex-wrap gap-1 align-items-center"></span>
    <div class="ms-auto d-flex gap-2">
      <button class="btn btn-outline-secondary" id="k-test"><i class="bi bi-plug me-1"></i>Test connection</button>
      <button class="btn btn-outline-primary" id="k-refresh"><i class="bi bi-arrow-clockwise me-1"></i>Refresh</button>
    </div>
  </div></div>
  <div id="k-empty" class="d-none"></div>
  <div id="k-main" class="d-none">
    <ul class="nav nav-tabs mb-3" id="k-tabs">
      <li class="nav-item"><button class="nav-link active" data-tab="overview">Overview</button></li>
      <li class="nav-item"><button class="nav-link" data-tab="cluster">Cluster</button></li>
      <li class="nav-item"><button class="nav-link" data-tab="pods">Pods <span class="nx-count" id="k-pod-err"></span></button></li>
      <li class="nav-item"><button class="nav-link" data-tab="workloads">Workloads</button></li>
      <li class="nav-item"><button class="nav-link" data-tab="nodes">Nodes</button></li>
      <li class="nav-item"><button class="nav-link" data-tab="namespaces">Namespaces</button></li>
      <li class="nav-item"><button class="nav-link" data-tab="network">Networking</button></li>
      <li class="nav-item"><button class="nav-link" data-tab="config">Config &amp; scaling</button></li>
      <li class="nav-item"><button class="nav-link" data-tab="storage">Storage</button></li>
      <li class="nav-item"><button class="nav-link" data-tab="access">Access</button></li>
      <li class="nav-item"><button class="nav-link" data-tab="events">Events</button></li>
      <li class="nav-item"><button class="nav-link" data-tab="cleanup">Cleanup</button></li>
    </ul>
    <div class="nx-toolbar d-none" id="k-toolbar">
      <div class="nx-grow"><input id="k-search" type="search" class="form-control" placeholder="Filter by name…"></div>
      <select id="k-ns" class="form-select" style="max-width:200px" aria-label="Namespace"><option value="">All namespaces</option></select>
      <select id="k-status" class="form-select d-none" style="max-width:170px" aria-label="Status">
        <option value="">All statuses</option><option value="running">Running</option><option value="pending">Pending</option><option value="error">Errors</option><option value="completed">Completed</option></select>
      <select id="k-kind" class="form-select d-none" style="max-width:170px" aria-label="Kind">
        <option value="deployments">Deployments</option><option value="statefulsets">StatefulSets</option><option value="daemonsets">DaemonSets</option><option value="cronjobs">CronJobs</option></select>
      <div class="form-check form-switch mb-0"><input class="form-check-input" type="checkbox" id="k-system"><label class="form-check-label small" for="k-system">System namespaces</label></div>
      <span id="k-create" class="ms-auto d-flex gap-2"></span>
    </div>
    <div id="k-pane"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/mock-data.js?v=202611231725"></script>
<script src="js/m01-api.js?v=202611231725"></script>
<script src="js/components.js?v=202611231725"></script>
<script src="js/app.js?v=202611231725"></script>
<script src="js/nx-ui.js?v=202611231725"></script>
<script src="js/kubernetes.js?v=202611231725"></script>
</body>
</html>
