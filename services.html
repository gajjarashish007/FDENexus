<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modules & Services · FDE Nexus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
<div class="nx-app" id="nx-app" data-page="services.html" data-title="Modules & Services">

  <div class="nx-page-head">
    <div><h1>Modules &amp; Services</h1>
      <p>Each module lives in its own folder under <span class="nx-mono">modules/</span> and plugs into the one portal: same login, database, audit log and UI. Status comes from each module's manifest.</p></div>
    <div class="nx-head-actions"><div class="form-check form-switch mb-0 me-2 d-none"><input class="form-check-input" type="checkbox" id="nx-mod-all"><label class="form-check-label small" for="nx-mod-all">Show hidden modules</label></div>
      <span class="nx-badge b-secondary" id="nx-mod-count"></span></div>
  </div>
  <div class="nx-toolbar">
    <div class="nx-grow"><input id="nx-mod-search" type="search" class="form-control" placeholder="Search modules and capabilities…"></div>
    <select id="nx-mod-group" class="form-select" style="max-width:200px"></select>
    <select id="nx-mod-status" class="form-select" style="max-width:180px">
      <option value="">All maturity</option><option value="live">Live</option><option value="partial">Partial</option><option value="planned">Planned</option>
    </select>
  </div>
  <div class="row g-3" id="nx-modules"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/m01-api.js"></script>
<script src="js/components.js"></script>
<script src="js/nx-ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
