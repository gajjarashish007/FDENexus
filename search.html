<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search · FDE Nexus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
<div class="nx-app" id="nx-app" data-page="search.html" data-title="Search">
  <div class="nx-page-head"><div><h1>Search results</h1><p id="sr-sub"></p></div></div>
  <div class="row g-3" id="sr-body"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/m01-api.js"></script>
<script src="js/components.js"></script>
<script src="js/app.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => setTimeout(async () => {
    const NX = window.NEXUS, esc = NX.esc, q = new URLSearchParams(location.search).get("q") || "";
    document.getElementById("sr-sub").textContent = q ? `Results for “${q}”` : "Type in the search box above.";
    const body = document.getElementById("sr-body");
    if (!q) return;
    try {
      const r = await NX.api.get("/api/search?q=" + encodeURIComponent(q));
      const sec = (title, icon, items, href) => `<div class="col-12 col-xl-4"><div class="nx-card h-100">
        <div class="nx-card-head"><i class="bi ${icon} text-primary"></i><h2>${title}</h2></div><div class="nx-card-body">
        ${items.length ? items.map(i => `<a class="d-block py-1 text-decoration-none" href="${href}"><span class="fw-semibold">${esc(i.name)}</span>
          <span class="small nx-muted"> ${esc(i.id)}${i.status ? " · " + esc(i.status) : ""}${i.category ? " · " + esc(i.category) : ""}${i.type ? " · " + esc(i.type) : ""}</span></a>`).join("")
          : '<div class="nx-muted small">No matches.</div>'}</div></div></div>`;
      body.innerHTML = sec("Catalog", "bi-grid", r.catalog || [], "requests.html") + sec("Requests", "bi-inbox", r.requests || [], "requests.html") +
        sec("Resources", "bi-boxes", r.resources || [], "instances.html");
    } catch (e) { body.innerHTML = `<div class="col-12"><div class="nx-empty"><i class="bi bi-exclamation-triangle"></i>${esc(e.message)}</div></div>`; }
  }, 0));
</script>
</body>
</html>
