<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IaC Changes · FDE Nexus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
<div class="nx-app" id="nx-app" data-page="changes.html" data-title="IaC Changes">
  <div class="nx-page-head">
    <div><h1>Infrastructure changes</h1>
      <p>Every infrastructure request becomes a change: generated Atmos stack, policy, cost and validation. Approved changes become GitLab merge requests.</p></div>
    <div class="nx-head-actions" id="ch-mode"></div>
  </div>
  <ul class="nav nav-tabs mb-3" id="ch-tabs">
    <li class="nav-item"><button class="nav-link active" data-tab="changes"><i class="bi bi-file-diff me-1"></i>Changes <span class="nx-count" id="ch-pending">0</span></button></li>
    <li class="nav-item"><button class="nav-link" data-tab="stacks"><i class="bi bi-layers me-1"></i>Stacks</button></li>
    <li class="nav-item"><button class="nav-link" data-tab="registry"><i class="bi bi-box me-1"></i>Module registry</button></li>
    <li class="nav-item"><button class="nav-link" data-tab="policies"><i class="bi bi-shield-check me-1"></i>Policies</button></li>
    <li class="nav-item"><button class="nav-link" data-tab="settings"><i class="bi bi-git me-1"></i>GitLab &amp; settings</button></li>
  </ul>
  <div data-pane="changes">
    <div class="nx-toolbar">
      <div class="nx-grow"><input id="ch-search" type="search" class="form-control" placeholder="Search id, title, environment, requester…"></div>
      <select id="ch-status" class="form-select" style="max-width:200px"><option value="">All statuses</option>
        <option value="pending_approval">Pending approval</option><option value="mr_open">MR open</option><option value="queued">Queued</option>
        <option value="applied">Applied</option><option value="blocked">Blocked</option><option value="rejected">Rejected</option><option value="failed">Failed</option></select>
      <button class="btn btn-outline-secondary" id="ch-refresh"><i class="bi bi-arrow-clockwise"></i></button>
    </div>
    <div class="nx-card"><div class="nx-table-wrap"><table class="nx-table"><thead><tr>
      <th>Change</th><th>Environment</th><th>Action</th><th>Risk</th><th>Cost/mo</th><th>Status</th><th>Requested</th><th class="text-end"></th></tr></thead>
      <tbody id="ch-body"></tbody></table></div></div>
  </div>
  <div data-pane="stacks" class="d-none"><div class="row g-3" id="st-body"></div></div>
  <div data-pane="registry" class="d-none"><div class="row g-3" id="rg-body"></div></div>
  <div data-pane="policies" class="d-none"><div class="nx-card"><div class="nx-table-wrap"><table class="nx-table">
    <thead><tr><th>Rule</th><th>Severity</th><th>What it checks</th><th>Frameworks</th></tr></thead><tbody id="po-body"></tbody></table></div></div></div>
  <div data-pane="settings" class="d-none"><div class="row g-3" id="se-body"></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/m01-api.js"></script>
<script src="js/components.js"></script>
<script src="js/app.js"></script>
<script src="js/nx-ui.js"></script>
<script src="js/changes.js"></script>
</body>
</html>
