# Atmos configuration for FDE Nexus infrastructure.
# One stack per environment (stacks/deploy/<environment>.yaml), written by the portal (M03) after approval.
#   atmos describe stacks
#   atmos terraform plan  vpc -s <environment>
base_path: "./"

components:
  terraform:
    base_path: "components/terraform"
    apply_auto_approve: false
    deploy_run_init: true
    init_run_reconfigure: true
    auto_generate_backend_file: true

stacks:
  base_path: "stacks"
  included_paths:
    - "deploy/**/*"
  excluded_paths:
    - "**/_*"
  name_pattern: "{stage}"

logs:
  file: "/dev/stderr"
  level: Warning
