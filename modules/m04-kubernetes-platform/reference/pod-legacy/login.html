<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pod Dashboard — Sign In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <style>
        :root {
            --primary: #2563eb;
            --gray-50: #f9fafb;
            --gray-900: #111827;
        }
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 45%, #312e81 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
            color: var(--gray-900);
        }
        .login-shell {
            width: min(420px, 100%);
        }
        .login-brand {
            text-align: center;
            color: #fff;
            margin-bottom: 1.25rem;
        }
        .login-brand h1 {
            font-size: 1.45rem;
            margin: 0 0 0.35rem;
            font-weight: 700;
        }
        .login-brand p {
            margin: 0;
            opacity: 0.85;
            font-size: 0.9rem;
        }
        .login-card {
            background: #fff;
            border-radius: 1rem;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.35);
            padding: 1.5rem;
        }
        .login-card .form-label {
            font-size: 0.82rem;
            font-weight: 600;
            color: #475569;
        }
        .login-card .input-group-text {
            background: #f8fafc;
            border-color: #e2e8f0;
        }
        .login-card .form-control {
            border-color: #e2e8f0;
        }
        .login-card .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 0.2rem rgba(37, 99, 235, 0.15);
        }
        .btn-login {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border: none;
            font-weight: 600;
            padding: 0.65rem 1rem;
        }
        .btn-login:hover {
            background: linear-gradient(135deg, #1d4ed8, #1e40af);
        }
        .login-error {
            display: none;
            font-size: 0.85rem;
        }
        .login-footer {
            text-align: center;
            margin-top: 1rem;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.78rem;
        }
    </style>
    <script src="pod-base.js"></script>
</head>
<body>
    <div class="login-shell">
        <div class="login-brand">
            <h1><i class="bi bi-shield-lock me-2"></i>Pod Dashboard</h1>
            <p>Sign in to access cluster management</p>
        </div>
        <div class="login-card">
            <div id="loginError" class="alert alert-danger py-2 login-error" role="alert"></div>
            <form id="loginForm" autocomplete="on">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-group input-group-sm">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="username" name="username" autocomplete="username" required autofocus>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group input-group-sm">
                        <span class="input-group-text"><i class="bi bi-key"></i></span>
                        <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-login w-100" id="loginBtn">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Sign In
                </button>
            </form>
        </div>
        <div class="login-footer">Protected EKSense pod management portal</div>
    </div>
    <script src="pod-base.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        let next = params.get('next') || '/dashboard.html';
        if (window.podUrl) next = podUrl(next);
        if (next.indexOf('%') >= 0) {
            try { next = decodeURIComponent(next); } catch (_) { /* use as-is */ }
        }

        function apiUrl(path) {
            return window.podUrl ? podUrl(path) : path;
        }

        async function checkExistingSession() {
            try {
                const res = await fetch(apiUrl('/api/auth/me'), { credentials: 'same-origin' });
                if (res.ok) {
                    window.location.replace(next);
                }
            } catch (_) {}
        }

        function showError(msg) {
            const el = document.getElementById('loginError');
            el.textContent = msg;
            el.style.display = 'block';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Signing in…';
            document.getElementById('loginError').style.display = 'none';
            try {
                const res = await fetch(apiUrl('/api/auth/login'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ username, password }),
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    showError(data.error || 'Login failed');
                    return;
                }
                await new Promise((r) => setTimeout(r, 150));
                window.location.replace(next);
            } catch (err) {
                showError(err.message || 'Unable to reach server');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i>Sign In';
            }
        });

        checkExistingSession();
    </script>
</body>
</html>
