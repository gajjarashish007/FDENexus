<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Infrastructure Builder · FDE Nexus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
<div class="nx-app" id="nx-app" data-page="builder.html" data-title="Infrastructure Builder">

  <div class="nx-page-head">
    <div><h1>Infrastructure Builder</h1>
      <p>Build infrastructure from a guided form. Fill the parameters and the YAML updates live. Then send to Slack or open a pull request.</p></div>
  </div>
  <div class="nx-flow mb-3" id="nx-b-flow">
    <span class="step"><i class="bi bi-ui-checks-grid"></i> Configure</span><i class="bi bi-arrow-right arrow"></i>
    <span class="step"><i class="bi bi-filetype-yml"></i> Preview YAML</span><i class="bi bi-arrow-right arrow"></i>
    <span class="step"><i class="bi bi-slack"></i> Send to Slack</span><i class="bi bi-arrow-right arrow"></i>
    <span class="step"><i class="bi bi-github"></i> Open PR</span>
  </div>
  <div class="row g-3">
    <div class="col-12 col-xl-6">
      <div class="nx-card"><div class="nx-card-head"><i class="bi bi-ui-checks-grid text-primary"></i><h2>Parameters</h2></div>
        <div class="nx-card-body">
          <label class="form-label small fw-semibold" for="nx-b-kind">What to build</label>
          <select class="form-select mb-3" id="nx-b-kind"></select>
          <form class="nx-builder-form" id="nx-b-form"></form>
        </div></div>
    </div>
    <div class="col-12 col-xl-6">
      <div class="nx-card"><div class="nx-card-head"><i class="bi bi-filetype-yml text-primary"></i><h2>Live preview</h2>
        <div class="nx-head-actions">
          <button class="btn btn-sm btn-outline-secondary" id="nx-b-copy"><i class="bi bi-clipboard me-1"></i>Copy</button>
          <button class="btn btn-sm btn-outline-secondary" id="nx-b-slack"><i class="bi bi-slack me-1"></i>Slack</button>
          <button class="btn btn-sm btn-primary" id="nx-b-pr"><i class="bi bi-github me-1"></i>Create PR</button>
        </div></div>
        <div class="nx-card-body">
          <pre class="nx-yaml" id="nx-b-yaml"></pre>
          <p class="small nx-muted mb-0 mt-2">Live preview only. Nothing is deployed. Review before use.</p>
        </div></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/m01-api.js"></script>
<script src="js/components.js"></script>
<script src="js/app.js"></script>
</body>
</html>
