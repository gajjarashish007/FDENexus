<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account data · FDE Nexus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css?v=202611231725" rel="stylesheet">
</head>
<body>
<div class="nx-app" id="nx-app" data-page="inventory.html" data-title="Account data">
  <div class="nx-page-head">
    <div><h1>Account data</h1>
      <p>Everything in a connected AWS account, synced into one central cache with read-only API calls. Search, filter and open any resource without waiting on AWS.</p></div>
  </div>
  <div class="nx-card mb-3"><div class="nx-card-body">
    <div class="d-flex flex-wrap gap-2 align-items-end">
      <div><label class="form-label small fw-semibold" for="iv-acct">AWS account</label><select class="form-select" id="iv-acct" style="min-width:300px"></select></div>
      <div><label class="form-label small fw-semibold" for="iv-scope">Regions to sync</label>
        <select class="form-select" id="iv-scope" style="min-width:230px"><option value="current">Account home region</option><option value="all">All enabled regions</option><option value="pick">Choose regions…</option></select></div>
      <button class="btn btn-primary" id="iv-sync"><i class="bi bi-arrow-repeat me-1"></i>Sync now</button>
      <button class="btn btn-outline-secondary" id="iv-svc-btn"><i class="bi bi-ui-checks me-1"></i>Services <span class="nx-count" id="iv-svc-n"></span></button>
      <div class="ms-auto text-end small" id="iv-stamp"></div>
    </div>
    <div id="iv-progress" class="mt-3 d-none"><div class="d-flex justify-content-between small mb-1"><span id="iv-prog-label"></span><span id="iv-prog-n"></span></div>
      <div class="progress" style="height:8px"><div class="progress-bar progress-bar-striped progress-bar-animated" id="iv-prog-bar" style="width:0%"></div></div></div>
  </div></div>
  <div class="row g-3 mb-3" id="iv-kpis"></div>
  <div class="row g-3">
    <div class="col-xl-3"><div class="nx-card"><div class="nx-card-body p-2" id="iv-services"><div class="small nx-muted p-2">No data yet.</div></div></div></div>
    <div class="col-xl-9">
      <div class="nx-toolbar">
        <div class="nx-grow"><input id="iv-q" type="search" class="form-control" placeholder="Search every resource: name, id, IP, tag value…"></div>
        <select id="iv-region" class="form-select" style="max-width:200px" aria-label="Region"><option value="">All regions</option></select>
        <select id="iv-state" class="form-select" style="max-width:190px" aria-label="State"><option value="">All states</option></select>
        <button class="btn btn-outline-secondary" id="iv-csv" title="Export the current view as CSV"><i class="bi bi-download"></i></button>
      </div>
      <div id="iv-errors"></div>
      <div class="nx-card"><div class="nx-table-wrap" style="max-height:64vh"><table class="nx-table"><thead id="iv-head"></thead><tbody id="iv-body"></tbody></table></div>
        <div class="nx-card-body d-flex justify-content-between align-items-center"><span class="small nx-muted" id="iv-info"></span><div class="btn-group" id="iv-pages"></div></div></div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/mock-data.js?v=202611231725"></script>
<script src="js/m01-api.js?v=202611231725"></script>
<script src="js/components.js?v=202611231725"></script>
<script src="js/app.js?v=202611231725"></script>
<script src="js/nx-ui.js?v=202611231725"></script>
<script src="js/inventory.js?v=202611231725"></script>
</body>
</html>
