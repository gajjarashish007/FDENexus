<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live inventory · FDE Nexus</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
<div class="nx-app" id="nx-app" data-page="inventory.html" data-title="Live inventory">
  <div class="nx-page-head">
    <div><h1>Live inventory</h1>
      <p>What actually exists in a connected AWS account, read live with read-only API calls. Nothing here changes AWS.</p></div>
  </div>
  <div class="nx-card mb-3"><div class="nx-card-body d-flex flex-wrap gap-2 align-items-end">
    <div><label class="form-label small fw-semibold" for="iv-acct">AWS account</label><select class="form-select" id="iv-acct" style="min-width:280px"></select></div>
    <div><label class="form-label small fw-semibold" for="iv-region">Region</label><select class="form-select" id="iv-region" style="min-width:220px"></select></div>
    <button class="btn btn-primary" id="iv-go"><i class="bi bi-cloud-download me-1"></i>Fetch live data</button>
    <div class="ms-auto small nx-muted" id="iv-stamp"></div>
  </div></div>
  <div class="row g-3 mb-3" id="iv-kpis"></div>
  <div id="iv-body"><div class="nx-empty"><i class="bi bi-cloud"></i>Pick an account and region, then fetch live data.</div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/m01-api.js"></script>
<script src="js/components.js"></script>
<script src="js/app.js"></script>
<script src="js/nx-ui.js"></script>
<script src="js/inventory.js"></script>
</body>
</html>
